[package]
name = "tapdream"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Automatic, privacy-preserving long-term timelapse from Tapo camera recordings"
license = "MIT"
readme = "README.md"

[[bin]]
name = "tapdream"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
crossbeam-channel = "0.5"
ctrlc = "3"
indicatif = "0.17"

# Tapo protocol
openssl = "0.10"
httparse = "1"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ccm = "0.5"
p256 = { version = "0.13", features = ["arithmetic"] }
num-bigint = "0.4"
libloading = "0.8"
uuid = { version = "1", features = ["v4"] }

# Vision / video
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "cuda", "tensorrt", "api-20"] }
ab_glyph = "0.2"
flate2 = "1"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
